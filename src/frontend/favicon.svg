<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The mark: a gap in a fence.

    Four uprights with the third one missing, over the same cold-to-warm
    sweep the rest of the interface uses. The gap is the product — a
    fence you set, with one place an action has to be let through.

    Colours are literal rather than var(--cold) etc. because a favicon is
    fetched on its own and never sees the page's stylesheet.
  -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5" />
      <stop offset="0.32" stop-color="#5b9be8" />
      <stop offset="0.62" stop-color="#9b7bd4" />
      <stop offset="1" stop-color="#f2568c" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0d0d10" />

  <g fill="url(#sweep)">
    <rect x="7" y="8" width="3" height="16" rx="1.5" />
    <rect x="13" y="8" width="3" height="16" rx="1.5" />
    <rect x="25" y="8" width="3" height="16" rx="1.5" />
  </g>

  <!-- The gap, marked rather than merely empty. -->
  <rect x="19" y="14.5" width="3" height="3" rx="1.5" fill="#f4f4f6" />
</svg>
