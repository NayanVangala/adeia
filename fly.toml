# Adeia on Fly.io — one machine, one volume, one origin.
#
# SQLite means one writer, which means one machine. Do not scale this past
# a single instance without moving the database somewhere that expects
# concurrent writers; two machines sharing nothing would silently diverge.

app = "adeia"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  ADEIA_DB_PATH = "/data/adeia.db"

  # Approval links are emailed and opened on a phone, so this has to be the
  # public address, not an internal one.
  PUBLIC_BASE_URL = "https://adeia.xyz"

  # Fly's proxy overwrites x-forwarded-for, so it can be believed here. On a
  # directly-exposed server it cannot: anyone can send that header, and the
  # visit counter would dedupe on a value the client chooses.
  ADEIA_TRUST_PROXY = "true"

  # The site is served from this same app, so no cross-origin caller is
  # expected. Kept empty rather than removed: an empty list denies every
  # origin, where a missing key would fall back to the localhost default.
  ADEIA_SITE_ORIGINS = ""

# Secrets are NOT set here — this file is committed. Set them with
# `fly secrets set NAME=value`, which stores them encrypted and restarts
# the app. See docs/deploy.md for the list.

[[mounts]]
  source = "adeia_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true

  # The machine stays up. Stopping it would be fine for the web pages and
  # wrong for the approval flow: an action can sit pending for hours, and
  # the link in that email has to answer the moment somebody taps it.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[checks.health]
  type = "http"
  port = 3000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
